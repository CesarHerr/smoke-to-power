# Servidor (Droplet): sin puertos publicados; Caddy llega por la red octatech
services:
  smoke-to-power:
    build: .
    image: smoke-to-power:latest
    container_name: smoke-to-power
    restart: unless-stopped
    mem_limit: 96m
    networks:
      - octatech

networks:
  octatech:
    external: true
