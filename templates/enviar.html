<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enviar datos | Smoke to Power</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    .send-card { max-width: 560px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 22px; }
    .field label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
    .field output { font-family: var(--mono); color: var(--accent); }
    .field input[type="range"] { width: 100%; accent-color: var(--accent); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .row select { font-family: var(--font); padding: 9px 12px; border-radius: 10px; background: var(--bg-card-hover); color: var(--text); border: 1px solid var(--border); }
    .check { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 0.9rem; }
    .result { font-size: 0.9rem; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); color: var(--text-muted); min-height: 48px; }
    .result.ok { border-color: rgba(34, 197, 94, 0.45); background: var(--green-bg); color: var(--green); }
    .result.err { border-color: rgba(255, 77, 79, 0.45); background: var(--red-bg); color: var(--red); }
    .back { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
    .back:hover { text-decoration: underline; }
    .note { font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo">⚡</div>
        <div>
          <h1>Enviar datos de prueba</h1>
          <p class="subtitle">Envía lecturas a <code>/api/sensor</code> como lo haría el ESP32</p>
        </div>
      </div>
      <a class="back" href="/">← Volver al dashboard</a>
    </header>

    <form class="card send-card" id="sendForm" novalidate>
      <div class="field">
        <label for="filter"><span>Obstrucción del filtro</span> <output id="filterOut">45.0 %</output></label>
        <input type="range" id="filter" name="filter" min="0" max="100" step="0.1" value="45" />
      </div>

      <div class="field">
        <label for="power"><span>Potencia</span> <output id="powerOut">18.7 W</output></label>
        <input type="range" id="power" name="power" min="0" max="60" step="0.1" value="18.7" />
      </div>

      <label class="check">
        <input type="checkbox" id="autoSend" />
        Enviar automáticamente al mover los controles
      </label>

      <div class="row">
        <button type="submit" class="btn btn-sim" id="sendBtn">Enviar ahora</button>
        <label class="check">
          Envío continuo
          <select id="interval">
            <option value="0">Desactivado</option>
            <option value="5000">cada 5 s</option>
            <option value="10000">cada 10 s</option>
          </select>
        </label>
      </div>

      <div class="result" id="result" aria-live="polite">Aún no se ha enviado ningún dato.</div>

      <p class="note">
        Cada envío es un <code>POST /api/sensor</code> con <code>Content-Type: application/json</code>.
        Al recibir datos, la simulación del servidor se detiene automáticamente.
      </p>
    </form>
  </div>

  <script src="/static/js/enviar.js"></script>
</body>
</html>
